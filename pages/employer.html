<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Post an Internship | InternPath</title>
    <link rel="stylesheet" href="../styles/employer.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="logo" href="../index.html">InternPath</a>
      <nav>
        <a href="../index.html">Home</a>
        <a href="../pages/browser.html">Browse</a>
        <a href="../pages/application.html">My Application</a>
        <a href="../pages/profile.html">Profile</a>
        <a href="../pages/employer.html" class="active">Employer</a>
      </nav>
    </header>
    <main>
      <h1>Post a new internship</h1>
      <p class="subtitle">Fill in the details below and click Publish.</p>
      <section class="form-card">
        <form id="internshipForm">
          <div class="form-grid">
            <label
              >Internship title *<input
                name="title"
                required
                maxlength="80"
                placeholder="e.g. Frontend Developer Intern"
            /></label>
            <label
              >Company name *<input
                name="company"
                required
                maxlength="70"
                placeholder="e.g. BrightApps"
            /></label>
            <label
              >Field *<select name="" required>
                <option value="">Choose a field</option>
                <option>Technology</option>
                <option>Marketing</option>
                <option>Finance</option>
                <option>Design</option>
                <option>Business</option>
                <option>Other</option>
              </select></label
            >
            <label
              >Work type *<select name="type" required>
                <option value="">Choose a type</option>
                <option>Remote</option>
                <option>Hybrid</option>
                <option>On-site</option>
              </select></label
            >
            <label
              >Monthly stipend (₹) *<select name="" required>
                <option value="">Choose a field</option>
                <option>10,000</option>
                <option>15,000</option>
                <option>20,000</option>
                <option>25,000</option>
                <option>30,000</option>
                <option>35,000</option>
              </select></label>
            <label
              >Duration *<input
                name="duration"
                required
                maxlength="40"
                placeholder="e.g. 3 months"
            /></label>
          </div>
          <label
            >Internship description *<textarea
              name="description"
              rows="4"
              required
              maxlength="600"
              placeholder="Describe the work and skills students need..."
            ></textarea>
          </label>
          <button type="submit">Publish Internship</button>
        </form>
      </section>
    </main>
    <script src="../script.js"></script>
  </body>
</html>
